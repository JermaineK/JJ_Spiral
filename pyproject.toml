[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jjparse"
version = "0.1.0"
description = "Josephson junction .dat parsing and analysis pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.23",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyarrow>=12.0",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
knee = ["ruptures>=1.1"]
stats = ["statsmodels>=0.14"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["jjparse"]
